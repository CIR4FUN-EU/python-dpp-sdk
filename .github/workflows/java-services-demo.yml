name: Java services demo verification

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Java image profile
        required: true
        default: pinned
        type: choice
        options:
          - pinned
          - 0.5.0
          - 0.4.0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEMO_DIR: examples/java-services-demo
      COMPOSE_PROJECT_NAME: dpp-py-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build isolated wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m build "$DEMO_DIR" --outdir "$DEMO_DIR/dist"
          python -m venv .java-services-demo-venv
          .java-services-demo-venv/bin/python -m pip install \
            dist/dpp_sdk-0.2.1-py3-none-any.whl \
            "$DEMO_DIR"/dist/dpp_sdk_java_services_demo-0.1.0-py3-none-any.whl
          .java-services-demo-venv/bin/python -m pip check

      - name: Select image profile
        run: |
          echo "DEMO_ENV_FILE=$GITHUB_WORKSPACE/$DEMO_DIR/env/${{ inputs.profile }}.env" \
            >> "$GITHUB_ENV"

      - name: Pull and start disposable services
        run: |
          docker compose -f "$DEMO_DIR/compose.yaml" --env-file "$DEMO_ENV_FILE" pull
          docker compose -f "$DEMO_DIR/compose.yaml" --env-file "$DEMO_ENV_FILE" \
            up -d --wait --wait-timeout 120

      - name: Run installed-wheel verification
        run: |
          mkdir -p artifacts
          outside="$(mktemp -d)"
          if [ "${{ inputs.profile }}" = "0.4.0" ]; then
            (cd "$outside" && "$GITHUB_WORKSPACE/.java-services-demo-venv/bin/python" -I \
              -m dpp_java_services_demo verify --env-file "$DEMO_ENV_FILE" --legacy \
              --report-file "$GITHUB_WORKSPACE/artifacts/verification-report.json")
          else
            (cd "$outside" && "$GITHUB_WORKSPACE/.java-services-demo-venv/bin/python" -I \
              -m dpp_java_services_demo verify --env-file "$DEMO_ENV_FILE" \
              --report-file "$GITHUB_WORKSPACE/artifacts/verification-report.json")
          fi
          rmdir "$outside"

      - name: Capture Compose evidence
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f "$DEMO_DIR/compose.yaml" --env-file "$DEMO_ENV_FILE" \
            ps --all > artifacts/compose-ps.txt 2>&1 || true
          docker compose -f "$DEMO_DIR/compose.yaml" --env-file "$DEMO_ENV_FILE" \
            images --format json > artifacts/compose-images.json 2>&1 || true
          docker compose -f "$DEMO_DIR/compose.yaml" --env-file "$DEMO_ENV_FILE" \
            logs --no-color --timestamps > artifacts/compose.log 2>&1 || true

      - name: Tear down disposable services
        if: always()
        run: |
          docker compose -f "$DEMO_DIR/compose.yaml" --env-file "$DEMO_ENV_FILE" \
            down --remove-orphans

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-services-demo-${{ inputs.profile }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
