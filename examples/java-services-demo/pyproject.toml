[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dpp-sdk-java-services-demo"
version = "0.1.0"
description = "Repository-only consumer demo for dpp-sdk and the Java DPP service images"
requires-python = ">=3.11"
dependencies = ["dpp-sdk==0.2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/dpp_java_services_demo"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dpp_java_services_demo",
    "tests",
    "compose.yaml",
    "env",
    ".env.example",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
