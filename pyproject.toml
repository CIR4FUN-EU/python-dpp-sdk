[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dpp-sdk"
dynamic = ["version"]
description = "Python SDK for interacting with Digital Product Passport (DPP) System Infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Enno Mueller" }]
keywords = ["dpp", "digital-product-passport", "EN-18222", "EN-18223", "sustainability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-sugar>=1.1.1",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
]
release = [
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/CIR4FUN-EU/python-dpp-sdk"
Repository = "https://github.com/CIR4FUN-EU/python-dpp-sdk"
Issues = "https://github.com/CIR4FUN-EU/python-dpp-sdk/issues"
Documentation = "https://github.com/CIR4FUN-EU/python-dpp-sdk/tree/main/docs"
Changelog = "https://github.com/CIR4FUN-EU/python-dpp-sdk/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/dpp_sdk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dpp_sdk"]
exclude = ["**/AGENTS.md", "**/.codex/**", "**/README.md"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dpp_sdk",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "docs/*.md",
    "docs/architecture/*.mmd",
    "docs/architecture/*.svg",
    "LICENSE",
    "examples/consumer_lifecycle.py",
]
exclude = [
    "examples/mock-services-demo",
    "**/.venv/**",
    "**/venv/**",
    "**/*-venv/**",
    "**/env/**",
    "**/site-packages/**",
    "**/dist-packages/**",
    "**/pyvenv.cfg",
    "**/.pytest_cache/**",
    "**/.mypy_cache/**",
    "**/.ruff_cache/**",
    "**/build/**",
    "**/dist/**",
    "**/verification-report.json",
    "**/legacy-verification-report.json",
    "**/AGENTS.md",
    "**/.codex/**",
    "docs/python-agent-drafts/**",
    "docs/java-python-parity/**",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["dpp_sdk"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jsonpatch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: opt-in live conformance tests against externally supplied endpoints",
]
